name: Build and Push Docker Image

on:
#  schedule:
#    - cron: '22 9 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
#  pull_request:
#    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: get repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Extract version from package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Show version number
        run: echo "Version is ${{ steps.package-version.outputs.version }}"
        
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: | 
           ${{ vars.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:${{ env.VERSION }} 
           ${{ vars.DOCKER_USERNAME }}/${{ env.REPOSITORY_NAME }}:latest
           
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
